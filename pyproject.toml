[project]
name = "hostai"
version = "0.1.0"
description = "Disposable Vast.ai GPU deployment manager"
authors = [
    { name = "Stefan Meinecke", email = "meinecke@greensec.de" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncssh>=2.24.0",
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "transformers>=5.16.1",
    "vastai>=1.5.6",
]

[project.scripts]
hostai = "hostai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "responses>=0.26.3",
    "ruff>=0.16.5",
    "vulture>=2.16",
    "xenon>=0.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hostai"]

[tool.ruff]
line-length = 120
exclude = ["docs", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=hostai --cov-report=term-missing"
markers = [
    "slow: test that may take a while or download data from the network",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.vulture]
min_confidence = 70
