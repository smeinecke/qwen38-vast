name: Manual CUDA build on local runner

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image target from profiles.json
        required: true
        default: a6000
        type: choice
        options:
          - a6000
          - ada
          - blackwell
          - all

permissions:
  contents: read
  packages: write

# Never start this workflow automatically. It is intended for the 56-core local
# runner and is only entered through workflow_dispatch.
concurrency:
  group: docker-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository
        run: |
          echo "Runner CPUs: $(nproc)"
          docker version
          jq -e '.schema_version == 1 and (.images|length > 0) and (.profiles|length > 0)' profiles.json >/dev/null
          bash -n start.sh entrypoint.sh qwen-init-ssh.sh .qwen-lib.sh \
            qwen-up qwen-down qwen-status qwen-logs qwen-bench qwen-results qwen-cache-setup \
            .qwen-cache-lib.sh scripts/prepare-authorized-keys

      - name: Select build target(s)
        id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$TARGET" == "all" ]]; then
            matrix="$(jq -c '{include:[.images[] | {profile:.name,cuda_arch:.cuda_arch,image_tag:.image_tag,description:.description}]}' profiles.json)"
          else
            matrix="$(jq -c --arg target "$TARGET" '{include:[.images[] | select(.name == $target) | {profile:.name,cuda_arch:.cuda_arch,image_tag:.image_tag,description:.description}]}' profiles.json)"
          fi
          [[ "$(jq '.include | length' <<<"$matrix")" -gt 0 ]] || { echo >&2 "Unknown target: $TARGET"; exit 2; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    needs: prepare
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # With one registered local runner, 'all' naturally queues these jobs one
      # after another. A selected single target gets all 56 cores via nproc.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show local build capacity
        run: |
          echo "Building ${{ matrix.profile }} / sm_${{ matrix.cuda_arch }}"
          echo "CPUs available to Docker: $(nproc)"
          free -h || true

      - name: Prepare baked SSH public key
        env:
          QWEN_SSH_PUBLIC_KEY: ${{ vars.QWEN_SSH_PUBLIC_KEY }}
          QWEN_SSH_GITHUB_USER: ${{ vars.QWEN_SSH_GITHUB_USER }}
          QWEN_SSH_DEFAULT_GITHUB_USER: ${{ github.repository_owner }}
        run: ./scripts/prepare-authorized-keys

      - name: Set up persistent Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: qwen38-local-builder
          keep-state: true
          cleanup: false

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cache-mount
          key: qwen38-local-ccache-v4-${{ runner.os }}-sm${{ matrix.cuda_arch }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            qwen38-local-ccache-v4-${{ runner.os }}-sm${{ matrix.cuda_arch }}-
            qwen38-local-ccache-v3-${{ runner.os }}-sm${{ matrix.cuda_arch }}-
            qwen38-ccache-v4-${{ runner.os }}-sm${{ matrix.cuda_arch }}-
            qwen38-ccache-v3-${{ runner.os }}-sm${{ matrix.cuda_arch }}-
          save-always: true

      - name: Report restored compiler cache
        run: |
          echo "compiler-cache exact-hit=${{ steps.compiler-cache.outputs.cache-hit }}"
          du -sh .buildkit-cache-mount 2>/dev/null || true
          find .buildkit-cache-mount -type f 2>/dev/null | wc -l | xargs echo "compiler-cache files:"

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}
          save-always: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.image_tag }}
            type=sha,prefix=${{ matrix.image_tag }}-sha-
            type=ref,event=tag,prefix=${{ matrix.image_tag }}-
          labels: |
            org.opencontainers.image.description=Qwen3.8 llama.cpp CUDA runtime - ${{ matrix.description }}
            io.qwen38.profile=${{ matrix.profile }}
            io.qwen38.cuda-arch=${{ matrix.cuda_arch }}
            io.qwen38.builder=self-hosted

      - name: Build and push with local 56-core runner
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            QWEN_BUILD_PROFILE=${{ matrix.profile }}
            CCACHE_SEED=${{ hashFiles('Dockerfile') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwen38-sm${{ matrix.cuda_arch }}
          cache-to: type=gha,scope=qwen38-sm${{ matrix.cuda_arch }},mode=max,ignore-error=true
          provenance: mode=max
