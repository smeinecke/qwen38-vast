name: Manual GB10 ARM64 image build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-gb10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate config and shell scripts
        run: |
          jq -e '.schema_version == 1 and (.images|length > 0) and (.profiles|length > 0)' profiles.json >/dev/null
          bash -n start.sh entrypoint.sh hostai-init-ssh.sh scripts/prepare-authorized-keys

      - name: Extract GB10 image config from profiles.json
        id: config
        run: |
          jq -e '.images[] | select(.name == "gb10")' profiles.json >/dev/null
          image=$(jq -c '.images[] | select(.name == "gb10")' profiles.json)
          for key in name cuda_arch image_tag description platform builder_base runtime_base; do
            value=$(echo "$image" | jq -r --arg k "$key" '.[$k] // (if $k == "builder_base" then "nvidia/cuda:13.3.1-cudnn-devel-ubuntu24.04" elif $k == "runtime_base" then "nvidia/cuda:13.3.1-runtime-ubuntu24.04" else null end)')
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done
          echo "$image" | jq .

      - name: Prepare baked SSH public key
        env:
          HOSTAI_SSH_PUBLIC_KEY: ${{ vars.HOSTAI_SSH_PUBLIC_KEY }}
          HOSTAI_SSH_GITHUB_USER: ${{ vars.HOSTAI_SSH_GITHUB_USER }}
          HOSTAI_SSH_DEFAULT_GITHUB_USER: ${{ github.repository_owner }}
        run: ./scripts/prepare-authorized-keys

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cache-mount
          key: qwen38-ccache-v4-${{ runner.os }}-${{ runner.arch }}-sm${{ steps.config.outputs.cuda_arch }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            qwen38-ccache-v4-${{ runner.os }}-${{ runner.arch }}-sm${{ steps.config.outputs.cuda_arch }}-
          save-always: true

      - name: Report restored compiler cache
        run: |
          echo "compiler-cache exact-hit=${{ steps.compiler-cache.outputs.cache-hit }}"
          du -sh .buildkit-cache-mount 2>/dev/null || true
          find .buildkit-cache-mount -type f 2>/dev/null | wc -l | xargs echo "compiler-cache files:"

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}
          save-always: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.config.outputs.image_tag }},enable={{is_default_branch}}
            type=sha,prefix=${{ steps.config.outputs.image_tag }}-sha-
            type=ref,event=tag,prefix=${{ steps.config.outputs.image_tag }}-
          labels: |
            org.opencontainers.image.description=Qwen3.8 llama.cpp CUDA runtime - ${{ steps.config.outputs.description }}
            io.qwen38.profile=${{ steps.config.outputs.name }}
            io.qwen38.cuda-arch=${{ steps.config.outputs.cuda_arch }}
            io.qwen38.platform=${{ steps.config.outputs.platform }}

      - name: Build and push GB10
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.config.outputs.platform }}
          push: true
          build-args: |
            BUILDER_BASE=${{ steps.config.outputs.builder_base }}
            RUNTIME_BASE=${{ steps.config.outputs.runtime_base }}
            CUDA_ARCHITECTURES=${{ steps.config.outputs.cuda_arch }}
            HOSTAI_BUILD_PROFILE=${{ steps.config.outputs.name }}
            PLATFORM=${{ steps.config.outputs.platform }}
            CCACHE_SEED=${{ hashFiles('Dockerfile') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwen38-${{ steps.config.outputs.platform }}-sm${{ steps.config.outputs.cuda_arch }}
          cache-to: type=gha,scope=qwen38-${{ steps.config.outputs.platform }}-sm${{ steps.config.outputs.cuda_arch }},mode=max,ignore-error=true
          provenance: mode=max
