name: Python Code Checks

permissions:
  contents: read
  checks: write

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-cache-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev --extra test

      - name: Run Ruff (Formatting Check)
        run: uv run make format

      - name: Run Ruff (Linting)
        run: uv run make check

      - name: Run xenon (Complexity)
        run: uv run make xenon || true

      - name: Run bandit (Security)
        run: uv run make bandit

      - name: Run pyright (Type Checking)
        run: uv run make pyright

      - name: Run pytest (Unit Tests)
        run: uv run make test
