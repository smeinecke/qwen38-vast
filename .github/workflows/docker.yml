name: Build and publish CUDA image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: bash -n start.sh qwen-up qwen-down qwen-status qwen-logs

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # Docker's normal GHA layer cache can skip the whole compile layer when
      # nothing changed, but BuildKit cache mounts (used by ccache) are not
      # persisted by the GHA backend on their own. Cache Dance injects/extracts
      # the ccache mount so changed llama.cpp builds can reuse object files.
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cache-mount
          key: qwen38-ccache-v1-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            qwen38-ccache-v1-${{ runner.os }}-

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwen38-vast
          cache-to: type=gha,scope=qwen38-vast,mode=max,ignore-error=true
          provenance: mode=max
