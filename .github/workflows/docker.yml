name: Build and publish CUDA images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate cumulative repository features
        run: bash ./scripts/validate-repo

      - name: Validate config and shell scripts
        run: |
          jq -e '.schema_version == 1 and (.images|length > 0) and (.profiles|length > 0)' profiles.json >/dev/null
          bash -n start.sh entrypoint.sh qwen-init-ssh.sh .qwen-lib.sh \
            qwen-up qwen-down qwen-status qwen-bench qwen-results qwen-cache-setup \
            .qwen-cache-lib.sh scripts/prepare-authorized-keys

      - name: Build matrix from profiles.json
        id: matrix
        run: |
          matrix="$(jq -c '{
            include:[
              .images[] | {
                profile:.name,
                cuda_arch:.cuda_arch,
                image_tag:.image_tag,
                description:.description,
                builder_base:(.builder_base // "vastai/base-image:cuda-12.8.1-cudnn-devel-ubuntu24.04-py312"),
                runtime_base:(.runtime_base // "nvidia/cuda:12.8.1-runtime-ubuntu24.04")
              }
            ]
          }' profiles.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare baked SSH public key
        env:
          QWEN_SSH_PUBLIC_KEY: ${{ vars.QWEN_SSH_PUBLIC_KEY }}
          QWEN_SSH_GITHUB_USER: ${{ vars.QWEN_SSH_GITHUB_USER }}
          QWEN_SSH_DEFAULT_GITHUB_USER: ${{ github.repository_owner }}
        run: ./scripts/prepare-authorized-keys

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cache-mount
          key: qwen38-ccache-v4-${{ runner.os }}-sm${{ matrix.cuda_arch }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            qwen38-ccache-v4-${{ runner.os }}-sm${{ matrix.cuda_arch }}-
            qwen38-ccache-v3-${{ runner.os }}-sm${{ matrix.cuda_arch }}-
          save-always: true

      - name: Report restored compiler cache
        run: |
          echo "compiler-cache exact-hit=${{ steps.compiler-cache.outputs.cache-hit }}"
          du -sh .buildkit-cache-mount 2>/dev/null || true
          find .buildkit-cache-mount -type f 2>/dev/null | wc -l | xargs echo "compiler-cache files:"

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}
          save-always: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.image_tag }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.image_tag }}-sha-
            type=ref,event=tag,prefix=${{ matrix.image_tag }}-
          labels: |
            org.opencontainers.image.description=Qwen3.8 llama.cpp CUDA runtime - ${{ matrix.description }}
            io.qwen38.profile=${{ matrix.profile }}
            io.qwen38.cuda-arch=${{ matrix.cuda_arch }}

      - name: Build and push ${{ matrix.profile }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILDER_BASE=${{ matrix.builder_base }}
            RUNTIME_BASE=${{ matrix.runtime_base }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            QWEN_BUILD_PROFILE=${{ matrix.profile }}
            CCACHE_SEED=${{ hashFiles('Dockerfile') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwen38-sm${{ matrix.cuda_arch }}
          cache-to: type=gha,scope=qwen38-sm${{ matrix.cuda_arch }},mode=max,ignore-error=true
          provenance: mode=max
