name: Build and publish CUDA images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: bash -n start.sh qwen-up qwen-down qwen-status qwen-logs

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - profile: a6000
            cuda_arch: '86'
            image_tag: a6000
            description: RTX A6000 / Ampere SM86
          - profile: ada-128k
            cuda_arch: '89'
            image_tag: ada-128k
            description: RTX 6000 Ada / L40S / SM89
          - profile: blackwell-128k
            cuda_arch: '120'
            image_tag: blackwell-128k
            description: RTX 5090 / RTX PRO 6000 Blackwell / SM120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # Keep one compiler cache per CUDA architecture. CUDA object files are
      # architecture-specific, so sharing one cache across SM86/89/120 wastes
      # space and creates needless churn.
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: .buildkit-cache-mount
          key: qwen38-ccache-v2-${{ runner.os }}-sm${{ matrix.cuda_arch }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            qwen38-ccache-v2-${{ runner.os }}-sm${{ matrix.cuda_arch }}-

      - name: Inject compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.image_tag }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.image_tag }}-sha-
            type=ref,event=tag,prefix=${{ matrix.image_tag }}-
          labels: |
            org.opencontainers.image.description=Qwen3.8 llama.cpp CUDA runtime - ${{ matrix.description }}
            io.qwen38.profile=${{ matrix.profile }}
            io.qwen38.cuda-arch=${{ matrix.cuda_arch }}

      - name: Build and push ${{ matrix.profile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            QWEN_BUILD_PROFILE=${{ matrix.profile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qwen38-sm${{ matrix.cuda_arch }}
          cache-to: type=gha,scope=qwen38-sm${{ matrix.cuda_arch }},mode=max,ignore-error=true
          provenance: mode=max
